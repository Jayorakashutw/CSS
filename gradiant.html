<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiant Example</title>
</head>
<style>
    #gradiantexample{
        width:300px;
        height:300px;
        border: 2px solid red;
        background-image: repeating-linear-gradient(red 5%, yellow 10%, green 15%);
    }
     #gradiantexample2{
        width:300px;
        height:300px;
        border: 2px solid red;
        background-image: repeating-radial-gradient( red, yellow 15%, green 20%);
    }

     #gradiantexample3{
        width:300px;
        height:300px;
        border: 2px solid red;
        border-radius: 50%;
        background-image: repeating-conic-gradient( red 0deg, yellow 10deg  , green 15deg,blue 20deg, pink 25deg);
    }
</style>
<body>
   <h2>gradiant Example</h2> 
   <div id="gradiantexample">Jay</div>

    <div id="gradiantexample2">Jay</div>
     <div id="gradiantexample3">Jay</div>
</body>
</html>
