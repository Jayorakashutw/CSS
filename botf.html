<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libertinus+Keyboard&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia&effect=fire" rel="stylesheet">
    <title>Document</title>
</head>
<style>
    p{
    outline-color: green;
    padding: 8px;
    }
     .dotted{
        outline-style: dotted;
        border-width: 2px;
        border-color: red;
        border-radius: 5px;
    }
    .dashed{
        outline-style: dashed;
        outline-width: medium;
    }
    .solid{
        outline-style: 3px solid blue;

    }
    .groove{
        outline-style: groove;
    }
    .mix{
        outline-style: solid dashed dotted double;
        border-color: red green blue yellow;
    }
    .none{
        outline-style: none;
    }
    .hidden{
        outline-style: hidden;
    }
    .outset{
        outline-style: outset;
    }
    .inset{
        outline-style: inset;
    }
    .double{
        outline-style: double;
    }
    .ridge{
        font-family: "Sofia", cursive;
        outline-style: ridge;
        text-align: center;
        font-weight: bold;
        text-transform: capitalize;
        color: white;
       
    }
    .shand{
        font-family: "Libertinus Keyboard", system-ui;
  font-weight: 400;
  font-style: normal;
        outline: 1px groove red;
        border: 3px solid blue;
        border-radius: 10px;
        outline-offset: -3px;
        text-align: center;
        font-weight: bold;
        text-transform: capitalize;
        color: white;
        text-shadow: 1px 1px 2px #000000, 0 0 25px blue, 0 0 5px red;
        /*word-spacing: 12px;
        line-height: 13px;
        letter-spacing: 12px;
        /*text-decoration: line-through;
        text-decoration-color: aqua;
        text-decoration-style: double;*/
    }
    .font-effect-fire{
        font-family: "Sofia", cursive;
        font-size: 30px;
        color: orange;
        text-align: center;
        font-weight: bold;+
        text-transform: capitalize;
       
        /*word-spacing: 12px;
        line-height: 13px;
        letter-spacing: 12px;
        /*text-decoration: line-through;
        text-decoration-color: aqua;
        text-decoration-style: double;*/
    }
    {

    }
</style>
<body>
    <p class="dotted">Dotted Border</p>
    <p class="dashed">dashed Border</p>
    <p class="solid">solid Border</p>
    <p class="groove">groove Border</p>
    <p class="mix">Dotted Border</p>
    <p class="none">none Border</p>
    <p class="hidden">hidden Border</p>
    <p class="outset">outset Border</p>
    <p class="inset">inset Border</p>
    <p class="double">double Border</p>
    <p class="ridge">ridge Border</p>
    <p class="shand">UDESHA TECHNOLOGY</p>
    <p class="font-effect-fire">UDESHA TECHNOLOGY</p>
</body>
</html>
