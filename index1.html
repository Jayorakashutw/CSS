<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .dotted{
        border-style: dotted;
        border-width: 2px;
        border-color: red;
        border-radius: 5px;
    }
    .dashed{
        border-style: dashed;
        border-width: medium;
    }
    .solid{
        border-left: 3px solid blue;

    }
    .groove{
        border-style: groove;
    }
    .mix{
        border-style: solid dashed dotted double;
        border-color: red green blue yellow;
    }
    .none{
        border-style: none;
    }
    .hidden{
        border-style: hidden;
    }
    .outset{
        border-style: outset;
    }
    .inset{
        border-style: inset;
    }
    .double{
        border-style: double;
    }
    .ridge{
        border-style: ridge;
    }
</style>
<body>
    <p class="dotted">Dotted Border</p>
    <p class="dashed">dashed Border</p>
    <p class="solid">solid Border</p>
    <p class="groove">groove Border</p>
    <p class="mix">Dotted Border</p>
    <p class="none">none Border</p>
    <p class="hidden">hidden Border</p>
    <p class="outset">outset Border</p>
    <p class="inset">inset Border</p>
    <p class="double">double Border</p>
    <p class="ridge">ridge Border</p>
</body>

</html>
