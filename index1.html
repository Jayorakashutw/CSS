<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-gray-100 font-sans">

    <!-- Sidebar -->
    <div id="sidebar" class="w-64 bg-gray-800 text-gray-100 flex flex-col transition-all duration-300">
        <div class="flex items-center justify-center h-16 bg-gray-900 text-2xl font-bold">
            Admin Panel
        </div>
        <nav class="flex-1 px-2 py-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Dashboard</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Users</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Reports</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Settings</a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button onclick="toggleSidebar()" class="w-full px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded">Toggle Sidebar</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content" class="flex-1 flex flex-col">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white shadow px-6 h-16">
            <div class="text-xl font-semibold">Dashboard</div>
            <div>
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500">Logout</button>
            </div>
        </header>

        <!-- Dashboard Cards -->
        <main class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-gradient-to-r from-pink-200 to-white p-4 rounded shadow-lg hover:shadow-xl transition-shadow">
                <h3 class="text-gray-600 text-sm">Total Users</h3>
                <p class="text-2xl font-bold">1,250</p>
            </div>
            <div class="bg-gradient-to-r from-pink-200 to-white p-4 rounded shadow-lg hover:shadow-xl transition-shadow">
                <h3 class="text-gray-600 text-sm">Active Sessions</h3>
                <p class="text-2xl font-bold">320</p>
            </div>
            <div class="bg-gradient-to-r from-pink-200 to-white p-4 rounded shadow-lg hover:shadow-xl transition-shadow">
                <h3 class="text-gray-600 text-sm">Revenue</h3>
                <p class="text-2xl font-bold">$12,450</p>
            </div>
            <div class="bg-gradient-to-r from-pink-200 to-white p-4 rounded shadow-lg hover:shadow-xl transition-shadow">
                <h3 class="text-gray-600 text-sm">Pending Tasks</h3>
                <p class="text-2xl font-bold">8</p>
            </div>
        </main>

        <!-- Additional Content -->
        <div class="p-6">
            <div class="bg-gradient-to-r from-pink-100 to-white rounded shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-2">Recent Activities</h3>
                <hr class="border-pink-300 mb-4"/>
                <ul class="space-y-2 text-gray-700">
                    <li class="border-b border-gray-200 py-2">User John updated profile</li>
                    <li class="border-b border-gray-200 py-2">Report generated for Q3</li>
                    <li class="border-b border-gray-200 py-2">New user registered: Alice</li>
                    <li class="py-2">System backup completed</li>
                </ul>
            </div>
        </div>

    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-16');
        }
    </script>

</body>
</html>
