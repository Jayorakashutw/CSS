<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .pagination{
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0px;
    }
    .pagination li a{
        display:block; 
        text-decoration: none;
        padding: 12px 16px;
        border: 1px solid red;
        margin: 0 4px;
        color: black;
        border-radius: 5px;
        background-color: lightgreen;
    }
</style>
<body>
    <ul class="pagination">
        <li><a href="#">Previous</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">4</a></li>
        <li><a href="#">5</a></li>
        <li><a href="#">Next</a></li>
    </ul>
</body>
</html>
