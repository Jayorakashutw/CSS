<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal navigation Bar</title>
</head>
<style>
    body{
        margin: 0;
       padding: 0;
    }
    ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #b7b1e3;
       /* position: fixed;
        top: 0;
        width: 100% ;
         display: flex;
       justify-content: center;*/
    }
    li{
        float: left;
        border-right: 1px solid #bbb;
        height: 60px;
    }
    li:last-child{
        border-right: none;
    }
    li a, .dropbtntext{
        display: inline-block;
        color: white;
        text-align: center;
        padding: 20px 16px;
        text-decoration: none;
    }
    li a:hover, .dropdown:hover .dropbtntext{
        background-color: #03e512;
    }
   /* li a:hover:not(.active){
        background-color: #111;
    }*/
    .active{
        background-color: #0b0168;
    }
    li img{
        width: 50px;
        height: auto;
        vertical-align: middle;
        padding: 5px;
        margin-left: 100px;
    }
    h1{
        margin-top: 100px;
    }
    p{
        margin: 20px;
        text-align: justify;
    }
    li.dropdown
    {
        display: inline-block;
    }

    .dropdown-content
    {
        display: none;
        position: absolute;
        background-color: #a0aeeb;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(12, 215, 49, 0.6);
        z-index: 1;
    }
    .dropdown-content a{
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    .dropdown-content a:hover{
        background-color: #f1f1f1;
    }
    .dropdown:hover .dropdown-content{
        display: block;
    }
</style>
<body>
     <ul>
        <li><img src="image/companylogo.png"></li>
        <li><a href="" class="active">Home</a></li>
        <li><a href="">About Us</a></li>
        <li><a href="">Contact Us</a></li>
        <li><a href="">Blogs</a></li>
        <li><a href="">Events</a></li>
        <li><a href="">Gallery</a></li>
        <li class="dropdown">
            <a href="javascript:void(0)" class="dropbtntext">Services</a>
            <div class="dropdown-content">
                <a href="">Web Design</a>
                <a href="">Development</a>
                <a href="">Hosting</a>
            </div>
        </li>
        <li><a href="">Feedback</a></li>
        <li style="float: right;"><a href="">Login</a></li>
    </ul>
</body>
</html>
