<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        background-color: lightblue ;
        grid-template-columns: auto auto auto auto;
    }
    .container div{
        background-color: coral;
        margin: 2px;
        padding: 2px;
        border: 2px solid red;
        text-align: center;
        font-size: 20px;
        width: 100px;
        height: 100px;
        background-color: lightgreen;
    }
</style>
<body>
    <h3>Flex Container Example</h3>
    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
    </div>
</body>
</html>
