<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms</title>
</head>
<style>
    h2{
        text-align: center;
        color: #c81d1d;
        font-family: Arial, Helvetica, sans-serif;
    }
    form{
        border: 2px solid #c81d1d;
        width: 400px;
        margin: auto;
        padding: 10px;
        box-shadow: 2px 2px 8px rgba(201, 57, 57, 0.26);
    }
    input[type=text],input[type=password]{
        width: 100%;
        padding: 8px 12px;
        margin: 8px 0;
        box-sizing: border-box;
        border-bottom: 2px solid #c81d1d;
        border-radius: 4px;
    }
    select{
        width: 100%;
        margin-top: -15px;
        padding: 8px 12px;
        box-sizing: border-box;
        border: 2px solid #c81d1d;
        border-radius: 4px;
    }
    input[type=submit], input[type=reset],input[type=button]{
        width: 40%;
        background-color: #c81d1d;
        color: white;
        padding: 10px 15px;
        margin: 8px 4.5%;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
<body>
    <h2>Login Forms</h2>
    <form action="" method="get">
        <input type="text" id="fname" name="fname" value="" placeholder="Enter Username"><br>     
        <input type="password" id="lname" name="lname" value="" placeholder="Enter Password"><br><br>
        <select name="" id="">
            <option value="">Select User</option>
            <option value="admin">Admin</option>
            <option value="user">User</option>
            <option value="guest">Guest</option>
        </select>
        <input type="submit" value="Login">
        <input type="button" value="cancel">
    </form>
</body>
</html>
