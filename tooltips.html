<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tooltip {
            margin-top: 200px;
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
            cursor: pointer; 
        }

        .toottiptext {
            visibility: hidden;
            width: 250px;
            background-color: rgb(8, 2, 77);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;

            /* Position the tooltip */
            position: absolute;
            z-index: 1;
            bottom: 150%; /* Place it below the text */
            left: 50%;
            margin-left: -60px;

            /* Fade in tooltip */
            opacity: 0;
            transition: opacity 2s;
        }

        .tooltip:hover .toottiptext {
            visibility: visible;
            opacity: 1;
        }
        .toottiptext::after {
            content: "";
            position: absolute;
            top: 100%; /* At the bottom of the tooltip */
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgb(232, 68, 3) transparent transparent transparent;
        }
        </style>
</head>
<body>
    <div class="tooltip">Hover over me to see tooltip
        <span class="toottiptext">Some tooltip text is here</span>
    </div>
</body>
</html>
