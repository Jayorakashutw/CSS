<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol{
            background: tomato;
            padding: 10px;
        }
        ol li{
            background: yellow;
            margin: 5px;
            padding: 5px;
        }
        ul{
            background: lightgreen;
            padding: 10px;
        }
        ul li{
            background: lightblue;
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h2>Link Example</h2>
    <ol>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Cold Drink</li>
    </ol>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Cold Drink</li>
    </ul>
</body>
</html>
