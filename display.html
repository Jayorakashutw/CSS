<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Tag</title>
</head>
<style>
    .btn {
        font-family: 'Libertinus Keyboard', serif;
        font-size: 20px;
        text-align: center;
        padding: 10px;
        background-color: #090934;
        color: white;
        border: solid 1px #a6d7c7;
        cursor: pointer;
    }
    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
    }
    li {
        display: inline;
        background-color: aqua;
        margin-right: 20px;
    }
    li:last-child {
       visibility: hidden;
    }  
    img{
        width: 100%;
        height: 800px;
        border: 2px solid red;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
    } 
</style>

<body>
    <p class="btn">Click me</p>
    <br><br>
    <p>Display Horizontal Menu</p>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Contact Us</a></li>
        <li><a href="#">Blogs</a></li>
        <li><a href="#">Events</a></li>
    </ul>

    <br><br><hr><br><br>
    <p>Position</p>
    <h1>Web Development class</h1>
    <img src="image/bgimg.jpg" alt="">
    <p>jhghjg jhgjhj ghj gkgkjghjgjhghjgjgj</p>
</body>

</html>
