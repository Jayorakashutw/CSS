<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Example</title>
</head>
<style>
    body{
        counter-reset: section ;
        padding: 20px;
        background: #f4f4f4;
    }
    /* each h2 increments the counter by 1*/
    h2::before
    {
        counter-increment: section;
        content: "Section " counter(section) ":- ";
        color: #c81d1d;
        font-family: Arial, Helvetica, sans-serif;
    }
    h2{
        text-align: left;
        color: #c81d1d;
        font-family: Arial, Helvetica, sans-serif;
    }
    p{
        text-align: left;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
    }
    </style>
<body>
    <h2>Introduction of CSS Example</h2>
    <p>This is the Introduction</p>
    <h2>Feature of CSS</h2>
    <p>Feature of CSS</p>
    <h2>Conclusion</h2>
    <p>Conclusion of CSS</p>
    
</body>
</html>
